    <!-- Anh nhan vat chay cua man cho: tai truoc, de man cho khong hien ra trong luc cho chinh no -->

    <!-- Man cho luc mo trang: viet thang vao day (khong nam trong file CSS rieng) de no hien
         ngay tu khung hinh dau, truoc ca khi cac file CSS khac ve. Nhan vat chay doc theo thanh
         tien do, chay toi dau la tai duoc toi do (--p, 0..100, do components/boot.js dat).
         main.js go no di khi canh dau tien da tai du (anh, nhan vat, font, loi doc). Mang hong
         hay JS loi thi sau 20s tu mo ra, khong de nguoi xem nhin man nau mai. -->
    <style>
        .boot {
            --p: 0;                       /* tien do 0..100, JS dat */
            --cw: clamp(4.6rem, 15vmin, 7rem);   /* be ngang nhan vat; cao = rong * 457 / 300 */
            position: fixed;
            inset: 0;
            z-index: 200;
            display: grid;
            place-content: center;
            justify-items: center;
            gap: 1.1rem;
            background: radial-gradient(ellipse at center, #3a2a19, #1a120a);
            color: #e8d9a8;
            font: 500 1.15rem/1.4 'EB Garamond', Georgia, 'Times New Roman', serif;
            letter-spacing: 0.06em;
            transition: opacity 0.8s ease, visibility 0s 0.8s;
            animation: boot-bail 0.8s ease 20s forwards;
        }
        .boot.is-done { opacity: 0; visibility: hidden; }

        /* Duong chay: nhan vat dung tren thanh, chan cham mat thanh */
        .boot__track {
            position: relative;
            width: min(78vw, 26rem);
            margin-top: calc(var(--cw) * 1.52);   /* cho cho nhan vat o phia tren */
        }
        .boot__bar {
            height: 0.5rem;
            border-radius: 999px;
            background: rgba(232, 201, 138, 0.16);
            box-shadow: inset 0 0 0 1px rgba(232, 201, 138, 0.3);
            overflow: hidden;
        }
        .boot__fill {
            width: calc(var(--p) * 1%);
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #b88a3e, #e8c98a);
            box-shadow: 0 0 0.7rem rgba(232, 201, 138, 0.55);
        }
        .boot__runner {
            position: absolute;
            bottom: 0.15rem;
            width: var(--cw);
            aspect-ratio: 300 / 457;
            /* chay het be rong thanh: nhan vat luon nam TRONG thanh, khong thoi ra hai dau */
            left: calc((100% - var(--cw)) * var(--p) / 100);
        }
        .boot__runner::before {   /* bong duoi chan */
            content: '';
            position: absolute;
            left: 50%;
            bottom: -2%;
            width: 70%;
            height: 6%;
            translate: -50% 50%;
            border-radius: 50%;
            background: radial-gradient(closest-side, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0));
        }
        /* Bon khung chay chong len nhau, bat lan luot 8 khung/giay (theo animations.json cua bo asset) */
        .boot__runner img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            visibility: hidden;
            animation: boot-run 0.5s steps(1, end) infinite;
        }
        .boot__runner img:nth-child(2) { animation-delay: 0.125s; }
        .boot__runner img:nth-child(3) { animation-delay: 0.25s; }
        .boot__runner img:nth-child(4) { animation-delay: 0.375s; }
        @keyframes boot-run {
            0%   { visibility: visible; }
            25%  { visibility: hidden; }
        }

        .boot__text {
            margin: 0;
            display: flex;
            align-items: baseline;
            gap: 0.7em;
        }
        .boot__label { font-style: italic; }
        .boot__dots span { animation: boot-dot 1.2s ease-in-out infinite; }
        .boot__dots span:nth-child(2) { animation-delay: 0.2s; }
        .boot__dots span:nth-child(3) { animation-delay: 0.4s; }
        .boot__pct {
            min-width: 3.2ch;
            text-align: right;
            font-weight: 600;
            color: #f3dca0;
            font-variant-numeric: tabular-nums;
        }
        @keyframes boot-dot { 0%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
        @keyframes boot-bail { to { opacity: 0; visibility: hidden; } }
        @media (prefers-reduced-motion: reduce) {
            .boot__runner img { animation: none; }
            .boot__runner img:first-child { visibility: visible; }
            .boot__dots span { animation: none; }
        }
    </style>
</head>
<body>
    <div class="boot" role="status" aria-live="polite">
        <div class="boot__track">
            <div class="boot__runner" aria-hidden="true">
                <img src="assets/images/character/right-0.webp" alt="" width="300" height="457" draggable="false">
                <img src="assets/images/character/right-1.webp" alt="" width="300" height="457" draggable="false">
                <img src="assets/images/character/right-2.webp" alt="" width="300" height="457" draggable="false">
                <img src="assets/images/character/right-3.webp" alt="" width="300" height="457" draggable="false">
            </div>
            <div class="boot__bar" role="progressbar" aria-label="Đang tải" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="boot__fill"></div>
            </div>
        </div>
        <p class="boot__text">
            <span class="boot__label">Đang tải<span class="boot__dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></span>
            <span class="boot__pct">0%</span>
        </p>
    </div>
    <!-- ---------- CONG: anh nen + o cua bam duoc ---------- -->
    <div class="stage stage--gate">
        <img class="bg"
             src="assets/images/background/gate-1440w.webp"
             srcset="assets/images/background/gate-480w.webp 480w,
                     assets/images/background/gate-960w.webp 960w,
                     assets/images/background/gate-1440w.webp 1440w,
                     assets/images/background/gate-1672w.webp 1672w"
             sizes="100vw"
             width="1672" height="941"
             fetchpriority="high" decoding="async" alt="">

        <button class="doorway" type="button" aria-expanded="false" aria-label="Mở cửa">
            <span class="leaf leaf--l">
                <img src="assets/images/door-left-640w.webp"
                     srcset="assets/images/door-left-320w.webp 320w,
                             assets/images/door-left-640w.webp 640w"
                     sizes="10vw" width="576" height="1514" alt="">
                <span class="shade"></span>
                <span class="back"></span>
                <span class="edge"></span>
            </span>
            <span class="leaf leaf--r">
                <img src="assets/images/door-right-640w.webp"
                     srcset="assets/images/door-right-320w.webp 320w,
                             assets/images/door-right-640w.webp 640w"
                     sizes="10vw" width="621" height="1521" alt="">
                <span class="shade"></span>
                <span class="back"></span>
                <span class="edge"></span>
            </span>
            <span class="seam"></span>
        </button>
    </div>

    <!-- Chi dan o man cong. May co ban phim thi dung phim, may cam ung thi cham vao cua. -->
    <p class="gate-hint" lang="vi">
        <span class="gate-hint__keys">Dùng phím ← ↑ → ↓ hoặc W A S D để đi tới cửa</span>
        <span class="gate-hint__touch">Chạm vào cửa để bước vào</span>
    </p>

    <!-- ---------- SANH: diem den sau khi bay qua o cua ---------- -->
    <div class="stage stage--hall">
        <img class="bg"
             src="assets/images/background/hall-1440w.webp"
             srcset="assets/images/background/hall-480w.webp 480w,
                     assets/images/background/hall-960w.webp 960w,
                     assets/images/background/hall-1440w.webp 1440w,
                     assets/images/background/hall-1672w.webp 1672w"
             sizes="100vw"
             width="1672" height="941"
             fetchpriority="low" decoding="async" alt="">
    </div>

    <!-- ---------- HAI LOP PHU CUA CHUYEN CANH ---------- -->
    <div class="vignette"></div>
    <div class="flare"></div>

    <!-- ---------- CAC PHONG KY NIEM ----------
         Dung bang JS tu thu muc memories/ (xem js/components/gallery.js).
         Nam TRUOC .letter: bam "Bat dau" thi khung tranh phai duoc nhin thay
         dang nhac len phia truoc canh phong dang hien dan. -->
    <div class="rooms"></div>

    <!-- ---------- DONG THOI GIAN: nut goc trai, mo ra bang cac ky niem ---------- -->
    <nav class="timeline" lang="vi">
        <button class="timeline__tab" type="button"
                aria-expanded="false" aria-controls="timeline-panel">
            <img src="assets/images/timeline-tab-480w.webp"
                 srcset="assets/images/timeline-tab-480w.webp 480w,
                         assets/images/timeline-tab-720w.webp 720w"
                 sizes="26vmin" width="1535" height="616"
                 fetchpriority="low" decoding="async" alt="">
            <span class="timeline__tab-label">Dòng thời gian</span>
        </button>
        <div class="timeline__panel" id="timeline-panel">
            <img class="timeline__frame"
                 src="assets/images/timeline-panel-768w.webp"
                 srcset="assets/images/timeline-panel-480w.webp 480w,
                         assets/images/timeline-panel-768w.webp 768w,
                         assets/images/timeline-panel-1024w.webp 1024w"
                 sizes="50vmin" width="1024" height="1536"
                 fetchpriority="low" decoding="async" alt="">
            <ul class="timeline__rows"></ul>
            <span class="timeline__more" aria-hidden="true"></span>
        </div>
    </nav>

    <!-- ---------- DOI CHE DO XEM: trinh chieu / cuon ngang ---------- -->
    <div class="mode" lang="vi">
        <button class="mode__btn" type="button" aria-expanded="false" aria-controls="mode-panel">
            <img src="assets/images/timeline-tab-480w.webp"
                 srcset="assets/images/timeline-tab-480w.webp 480w,
                         assets/images/timeline-tab-720w.webp 720w"
                 sizes="17vmin" width="1535" height="616"
                 fetchpriority="low" decoding="async" alt="">
            <span class="mode__label">Chế độ xem</span>
        </button>

        <div class="mode__panel" id="mode-panel">
            <button class="mode__choice" type="button" data-mode="show">
                <span class="mode__name">Trình chiếu</span>
                <span class="mode__desc">Mỗi lúc một căn phòng. Bấm <b>TIẾP</b> để sang
                    kỷ niệm sau, bấm vào tường để lùi lại.</span>
            </button>
            <button class="mode__choice" type="button" data-mode="strip">
                <span class="mode__name">Cuộn ngang</span>
                <span class="mode__desc">Các phòng nối thành một dải. Lăn chuột hoặc
                    nhấn giữ rồi kéo sang ngang; trên điện thoại thì vuốt ngang
                    (máy cần xoay ngang).</span>
            </button>
            <button class="mode__tour" type="button">Xem lại hướng dẫn</button>
        </div>
    </div>

    <!-- ---------- THUYET MINH: nhan vat doc loi cua phong dang xem. Chi hien trong phong co loi. ---------- -->
    <button class="narrate" type="button" hidden aria-pressed="false" lang="vi">
        <svg class="narrate__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M5 4.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-6.2L8 20.2V16.5H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z"/>
            <path class="narrate__line" d="M7.5 9h9M7.5 12h5.5"/>
        </svg>
        <span class="narrate__label">Thuyết minh</span>
    </button>

    <!-- ---------- NHAC NEN ----------
         preload="none": ban nhac nang, chi tai khi nguoi doc bam mo cua.
         Nut loa chi hien ra sau khi nhac da bat (truoc do khong co gi de tat). -->
    <audio class="music" src="assets/audios/theme-1.mp3" preload="none"></audio>
    <button class="sound" type="button" hidden aria-pressed="true" aria-expanded="false" aria-controls="volume" aria-label="Tắt nhạc nền">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="sound__horn" d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4z"/>
            <path class="sound__wave sound__wave--near" d="M15.2 9.4a3.6 3.6 0 0 1 0 5.2"/>
            <path class="sound__wave sound__wave--far" d="M17.6 7.1a7 7 0 0 1 0 9.8"/>
            <path class="sound__cross" d="M15.6 9.6l5 4.8M20.6 9.6l-5 4.8"/>
        </svg>
    </button>

    <!-- Goi y di chuyen nhan vat, hien mot lan luc vao phong dau tien (components/move-hint.js) -->
    <div class="move-hint" role="status" lang="vi" hidden>
        <div class="move-hint__keys" aria-hidden="true">
            <span class="move-hint__pad"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
            <span class="move-hint__or">hoặc</span>
            <span class="move-hint__pad move-hint__pad--arrows"><kbd>&uarr;</kbd><kbd>&larr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd></span>
        </div>
        <p class="move-hint__text move-hint__text--keys">Bấm phím để đưa nhân vật đi lại trong phòng</p>
        <p class="move-hint__text move-hint__text--touch">Vuốt ngang để đi sang phòng khác, nhân vật sẽ đi theo</p>
    </div>

    <!-- Tang giam am luong nhac nen: mo ben canh nut loa (components/volume.js). -->
    <div class="volume" id="volume" role="group" aria-label="Âm lượng nhạc nền" lang="vi" hidden>
        <button class="volume__step" type="button" data-step="-1" aria-label="Giảm âm lượng">&minus;</button>
        <input class="volume__range" type="range" min="0" max="100" step="5" value="100" aria-label="Âm lượng nhạc nền">
        <button class="volume__step" type="button" data-step="1" aria-label="Tăng âm lượng">+</button>
        <output class="volume__pct" aria-live="off">100%</output>
    </div>

    <!-- Nut xoay man hinh: goc tren-phai, ben trai nut "Che do xem". Chi hien khi dang o che do cuon
         ngang ma may dang cam doc. Chi GOI Y, khong chan gi: bam thi thu khoa huong, khong duoc thi
         nhac xoay tay. -->
    <button class="rotate-btn" type="button" lang="vi" aria-label="Xoay ngang màn hình">
        <svg class="rotate-btn__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="8" y="3.5" width="8" height="13" rx="1.6"/>
            <path d="M11 14h2"/>
            <path d="M5 19.5a8.5 8.5 0 0 0 14 0M16.6 18.6l2.6 1.1.9-2.7"/>
        </svg>
        <span class="rotate-btn__tip" role="status">Xoay ngang máy để xem dải kỷ niệm</span>
    </button>

    <!-- ---------- MAN CHUYEN CHUONG ----------
         Vua la tam bien ngan hai chuong, vua la man cho tai anh phong sau. -->
    <div class="interlude">
        <p class="interlude__text"></p>
    </div>

    <!-- ---------- KHUNG TRANH: roi xuong giua sanh, khac loi nhan ---------- -->
    <div class="letter" lang="vi">
        <div class="letter__frame">
            <!-- Man du lon thi khung vang nam ngang, con lai la khung da doc.
                 Nguong phai khop @media trong css/tokens.css: lech nhau thi
                 anh mot ti le ma hop khung mot ti le -> khung bi keo meo. -->
            <picture>
                <source media="(min-width: 760px) and (min-height: 620px)"
                        srcset="assets/images/frame-02-480w.webp 480w,
                                assets/images/frame-02-960w.webp 960w,
                                assets/images/frame-02-1536w.webp 1536w"
                        sizes="66vw"
                        width="1536" height="1024">
                <img class="letter__art"
                     src="assets/images/frame-891w.webp"
                     srcset="assets/images/frame-480w.webp 480w,
                             assets/images/frame-891w.webp 891w"
                     sizes="96vw"
                     width="891" height="1232"
                     fetchpriority="low" decoding="async" alt="">
            </picture>
            <h1 class="letter__title">Lời ngỏ</h1>
            <div class="letter__page"></div>
            <!-- Nam trong o bau duc duoi day khung. Mot nut, hai viec: dang go
                 chu thi la "Bỏ qua" (hien het chu ngay), go xong thi thanh
                 "Bắt đầu" (mo phong ky niem dau tien). -->
            <button class="letter__start" type="button">
                <span class="letter__word letter__word--skip">Bỏ qua</span>
                <span class="letter__word letter__word--go">Bắt đầu</span>
            </button>
        </div>
    </div>
    <!-- ---------- TOUR HUONG DAN ----------
         Chay mot lan khi lan dau vao mot phong. Noi dung tung buoc o TOUR trong
         js/content.js; o day chi la cai khung. -->
    <div class="tour" lang="vi" hidden>
        <div class="tour__spot"></div>
        <div class="tour__card">
            <p class="tour__count"></p>
            <h2 class="tour__title"></h2>
            <p class="tour__text"></p>
            <div class="tour__nav">
                <button class="tour__skip" type="button">Bỏ qua</button>
                <button class="tour__next" type="button">Tiếp</button>
            </div>
        </div>
    </div>
</body>
